<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SST Learning Hub</title><style>body{font-family:Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7f8;color:#334155}.x{padding:24px;text-align:center}.s{width:34px;height:34px;border:4px solid #d7e6dd;border-top-color:#00a651;border-radius:50%;animation:r .8s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="x"><div class="s"></div><p>正在加载 SST 交互学习材料…</p></div><script>(async()=>{try{const n=7;const a=[];for(let i=0;i<n;i++){const u=`part-${String(i).padStart(2,'0')}.txt?v=2`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u);a.push(await r.text())}document.open();document.write(a.join(''));document.close()}catch(e){document.body.innerHTML='<div class="x"><h2>加载失败</h2><p>请刷新页面重试。</p></div>'}})();</script></body></html>
